name: kstreami-wss

services:
  backend:
    build: ./backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    expose:
      - "8000"

  frontend:
    build: ./frontend
    expose:
      - "5173"
    depends_on:
      - backend

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      KSTREAMI_HOST: ${KSTREAMI_HOST:-localhost}
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:
