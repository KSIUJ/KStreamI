services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    stdin_open: true
    tty: true
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend